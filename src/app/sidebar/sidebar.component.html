<mat-sidenav-container class="sidenav-container">

  <mat-sidenav #sidenav mode="side" [opened]="isOpen" style="background-color:#004481">

    <mat-nav-list>

      <!-- GENERAL -->

      <div class="menu-section">
        <span class="menu-title" style="color: white;">GENERAL</span>
      </div>

      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span class="font">Dashboard</span>
      </a>

      <!-- OPERACIONES -->

      <div class="menu-section">
        <span class="menu-title" style="color: white;">OPERACIONES</span>
      </div>

      <a mat-list-item routerLink="/productos" routerLinkActive="active">
        <mat-icon>inventory_2</mat-icon>
        <span class="font">Productos</span>
      </a>

      <a mat-list-item routerLink="/ventas" routerLinkActive="active">
        <mat-icon>point_of_sale</mat-icon>
        <span class="font">Ventas</span>
      </a>

      <a mat-list-item routerLink="/clientes" routerLinkActive="active">
        <mat-icon>groups</mat-icon>
        <span class="font">Clientes</span>
      </a>

      <a mat-list-item routerLink="/pago" routerLinkActive="active">
        <mat-icon>payments</mat-icon>
        <span class="font">Pagos</span>
      </a>

      <!-- SOLO ADMIN -->

      @if (authService.isAdmin()) {

      <div class="menu-section">
        <span class="menu-title" style="color: white;">ADMINISTRACIÓN</span>
      </div>

      <a mat-list-item routerLink="/categoria" routerLinkActive="active">
        <mat-icon>category</mat-icon>
        <span class="font">Categorías</span>
      </a>

      <a mat-list-item routerLink="/empleados" routerLinkActive="active">
        <mat-icon>badge</mat-icon>
        <span class="font">Empleados</span>
      </a>

      <a mat-list-item routerLink="/proveedores" routerLinkActive="active">
        <mat-icon>local_shipping</mat-icon>
        <span class="font">Proveedores</span>
      </a>

      <a mat-list-item routerLink="/metodos-pago" routerLinkActive="active">
        <mat-icon>credit_card</mat-icon>
        <span class="font">Métodos de Pago</span>
      </a>

      <a mat-list-item routerLink="/usuario" routerLinkActive="active">
        <mat-icon>manage_accounts</mat-icon>
        <span class="font">Usuarios</span>
      </a>

      }

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>
