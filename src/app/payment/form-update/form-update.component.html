<div class="payment-modal">

  <div class="modal-header">

    <div class="header-icon edit">
      <mat-icon>edit</mat-icon>
    </div>

    <div>
      <h2>Actualizar Método de Pago</h2>
      <p>
        Modifica la información del método de pago seleccionado.
      </p>
    </div>

  </div>

  <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">

    <div class="section-title">
      Información General
    </div>

    <div class="form-row">

      <mat-form-field appearance="outline" class="form-field">

        <mat-label>Nombre</mat-label>

        <input
          matInput
          formControlName="nombre"
          required />

        <mat-error *ngIf="paymentForm.get('nombre')?.hasError('required')">
          El nombre es obligatorio.
        </mat-error>

      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">

        <mat-label>Descripción</mat-label>

        <input
          matInput
          formControlName="descripcion"
          required />

        <mat-error *ngIf="paymentForm.get('descripcion')?.hasError('required')">
          La descripción es obligatoria.
        </mat-error>

      </mat-form-field>

    </div>

    <div class="info-box">

      <mat-icon>info</mat-icon>

      Los cambios se aplicarán inmediatamente al método de pago.

    </div>

    <div class="modal-actions">

      <button
        mat-stroked-button
        type="button"
        (click)="closeDialogUpdate()">

        Cancelar

      </button>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="paymentForm.invalid">

        <mat-icon>save</mat-icon>

        Actualizar Método

      </button>

    </div>

  </form>

</div>
