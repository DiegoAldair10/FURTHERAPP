<h2 mat-dialog-title>Actualizar Producto</h2>
<div mat-dialog-content>
  <form [formGroup]="productsForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" required />
        <mat-error *ngIf="productsForm.get('nombre')?.hasError('required')">
          El nombre es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="descripcion" required />
        <mat-error *ngIf="productsForm.get('descripcion')?.hasError('required')">
          La descripción es obligatoria.
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoriaId" required>
          <mat-option *ngFor="let cat of categorias" [value]="cat.categoriaId">
            {{ cat.nombre }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Precio</mat-label>
        <input matInput formControlName="precio_venta" required />
        <mat-error *ngIf="productsForm.get('precio_venta')?.hasError('required')">
          El precio es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Costo Promedio</mat-label>
        <input matInput formControlName="costo_promedio" required />
        <mat-error *ngIf="productsForm.get('costo_promedio')?.hasError('required')">
          El costo promedio es obligatorio.
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Stock</mat-label>
        <input matInput formControlName="stock" />
        <mat-error *ngIf="productsForm.get('stock')?.hasError('required')">
          El stock es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="estado" required>
          <mat-option value="Y">Activo</mat-option>
          <mat-option value="N">Inactivo</mat-option>
        </mat-select>
        <mat-error *ngIf="productsForm.get('estado')?.hasError('required')">
          El estado es obligatorio.
        </mat-error>
      </mat-form-field>
    </div>

    <div mat-dialog-actions align="end">
      <button mat-button type="button" (click)="closeDialogUpdate()">
        Cancelar
      </button>
      <button mat-raised-button color="primary" type="submit" [disabled]="productsForm.invalid">
        Guardar
      </button>
    </div>
  </form>
</div>
