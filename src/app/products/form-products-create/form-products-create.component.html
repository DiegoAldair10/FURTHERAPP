<div class="product-modal">

  <div class="modal-header">
    <div class="header-icon">
      <mat-icon>inventory_2</mat-icon>
    </div>

    <div>
      <h2>Agregar producto</h2>
      <p>Completa la información para registrar un nuevo producto</p>
    </div>
  </div>

  <form [formGroup]="productsForm" (ngSubmit)="onSubmit()">

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Nombre del producto</mat-label>
        <input matInput formControlName="nombre" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="descripcion" required />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="form-field full">
      <mat-label>Categoría</mat-label>
      <mat-select formControlName="categoriaId" required>
        <mat-option *ngFor="let cat of Categorys" [value]="cat.categoriaId">
          {{ cat.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Precio de venta</mat-label>
        <input matInput type="number" formControlName="precio_venta" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Costo promedio</mat-label>
        <input matInput type="number" formControlName="costo_promedio" required />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Stock inicial</mat-label>
        <input matInput type="number" formControlName="stock" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Estado del producto</mat-label>
        <mat-select formControlName="estado" required>
          <mat-option value="Y">Activo</mat-option>
          <mat-option value="N">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="modal-actions">
      <button mat-button type="button" (click)="closeDialog()">
        Cancelar
      </button>

      <button mat-raised-button color="primary" type="submit" [disabled]="productsForm.invalid">
        <mat-icon>save</mat-icon>
        Guardar producto
      </button>
    </div>

  </form>

</div>
